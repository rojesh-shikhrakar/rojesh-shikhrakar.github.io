name: Deploy to GitHub Pages

on:
  push:
    branches: 'main'
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/**'
      - '!.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ponytail: caches vite's transform cache so unchanged routes rebuild fast
      - uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: vite-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: vite-${{ hashFiles('bun.lock') }}-

      - name: Build
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
