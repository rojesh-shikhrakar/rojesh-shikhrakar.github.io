<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, follow" />
		<title>Page not found | Rojesh Man Shikhrakar</title>
		<meta name="description" content="The page you were looking for could not be found." />
		<style>
			:root {
				color-scheme: light;
				font-family: Manrope, system-ui, sans-serif;
				background: #f7f4ee;
				color: #121c26;
			}
			body {
				display: grid;
				min-height: 100dvh;
				margin: 0;
				place-items: center;
			}
			main {
				width: min(40rem, calc(100% - 2.5rem));
			}
			h1 {
				margin: 0 0 1rem;
				font-family: Newsreader, Georgia, serif;
				font-size: clamp(3rem, 9vw, 5rem);
				line-height: 1;
			}
			p {
				color: #404946;
				font-size: 1.125rem;
			}
			a {
				display: inline-flex;
				min-height: 3rem;
				align-items: center;
				margin-top: 1rem;
				padding: 0 1.5rem;
				border-radius: 999px;
				background: #00453b;
				color: white;
				font-weight: 700;
				text-decoration: none;
			}
			a:focus-visible {
				outline: 3px solid #00453b;
				outline-offset: 4px;
			}
		</style>
	</head>
	<body>
		<main>
			<p>Error 404</p>
			<h1>Page not found</h1>
			<p>The address may have changed, or the page may no longer exist.</p>
			<a href="/">Back to home</a>
		</main>
	</body>
</html>
